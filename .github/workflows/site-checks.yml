name: Site and publication checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated files
        run: python _rebuild.py --check
      - name: Validate site contracts
        run: python tests/validate_site.py
      - name: Validate citation exports
        run: python tests/validate_citations.py
