name: Site, publication, Research Note, and Research Path checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated files
        run: python _rebuild.py --check
      - name: Validate site contracts
        run: python tests/validate_site.py
      - name: Validate citation exports
        run: python tests/validate_citations.py
      - name: Validate Research Notes
        run: python tests/validate_research_notes.py
      - name: Validate Research Paths
        run: python tests/validate_research_paths.py
      - name: Validate local file preview routing
        run: node tests/validate_file_preview.js
