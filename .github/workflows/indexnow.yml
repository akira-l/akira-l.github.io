name: Notify IndexNow

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "publications/**"
      - "zh/publications/**"
      - "sitemap.xml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit sitemap URLs
        run: python _indexnow.py
